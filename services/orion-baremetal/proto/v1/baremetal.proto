syntax = "proto3";

package baremetal.v1;

option go_package = "github.com/horizon/orion/services/orion-baremetal/proto/v1;baremetalv1";

service BaremetalService {
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc SetPowerState(SetPowerStateRequest) returns (OperationResponse);
  rpc SetBootDevice(SetBootDeviceRequest) returns (OperationResponse);
  rpc ProvisionNode(ProvisionNodeRequest) returns (OperationResponse);
  rpc DeprovisionNode(DeprovisionNodeRequest) returns (OperationResponse);
}

enum PowerState {
  POWER_STATE_UNKNOWN = 0;
  POWER_STATE_ON = 1;
  POWER_STATE_OFF = 2;
  POWER_STATE_REBOOT = 3;
}

enum NodeStatus {
  NODE_STATUS_UNKNOWN = 0;
  NODE_STATUS_ENROLLING = 1;
  NODE_STATUS_ACTIVE = 2;
  NODE_STATUS_DEGRADED = 3;
  NODE_STATUS_FAILED = 4;
}

message BaremetalNode {
  string id = 1;
  string name = 2;
  string driver = 3;
  PowerState power_state = 4;
  string boot_device = 5;
  string security_mode = 6;
  NodeStatus status = 7;
}

message CreateNodeRequest {
  string name = 1;
  string driver = 2;
  string endpoint = 3;
  string node_id = 4;
  string boot_device = 5;
  string security_mode = 6;
  map<string, string> config = 7;
}

message CreateNodeResponse { BaremetalNode node = 1; }
message GetNodeRequest { string node_id = 1; }
message GetNodeResponse { BaremetalNode node = 1; }
message ListNodesRequest {}
message ListNodesResponse { repeated BaremetalNode nodes = 1; }

message SetPowerStateRequest {
  string node_id = 1;
  PowerState power_state = 2;
}

message SetBootDeviceRequest {
  string node_id = 1;
  string boot_device = 2;
}

message ProvisionNodeRequest {
  string node_id = 1;
  string instance_info = 2;
}

message DeprovisionNodeRequest { string node_id = 1; }

message OperationResponse {
  bool success = 1;
  string operation_id = 2;
  string error = 3;
}
