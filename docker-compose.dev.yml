services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:latest
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "/nats-server", "-v"]
      interval: 5s
      timeout: 3s
      retries: 20

  orion-operation:
    build:
      context: .
      dockerfile: services/orion-operation/Dockerfile
    ports:
      - "8090:8090"
      - "50052:50052"
    environment:
      ORION_DB_DSN: "postgres://orion:orion@postgres:5432/orion?sslmode=disable"
      ORION_NATS_URL: "nats://nats:4222"
      ORION_OPERATION_LISTEN_ADDR: ":8090"
      ORION_OPERATION_GRPC_ADDR: ":50052"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - orion

  orion-node-agent:
    build:
      context: .
      dockerfile: agents/orion-node-agent/Dockerfile
    ports:
      - "50051:50051"
      - "8084:8084"
    environment:
      ORION_NODE_AGENT_GRPC_PORT: "50051"
      ORION_NODE_AGENT_HTTP_PORT: "8084"
      ORION_NODE_AGENT_STORAGE_DIR: /var/tmp/orion-node-agent
      ORION_NATS_URL: "nats://nats:4222"
    volumes:
      - /var/tmp/orion-node-agent:/var/tmp/orion-node-agent
    privileged: true
    networks:
      - orion

networks:
  orion:
    driver: bridge
