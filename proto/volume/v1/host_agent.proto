syntax = "proto3";

package volume.v1;

option go_package = "github.com/horizon/orion/gen/go/volume/v1;volumev1";

service VolumeHostAgent {
  rpc CreateVolume(CreateVolumeRequest) returns (VolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc ObserveVolume(ObserveVolumeRequest) returns (VolumeResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (SnapshotResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message CreateVolumeRequest {
  string volume_id = 1;
  int32 size_gb = 2;
}

message DeleteVolumeRequest {
  string volume_id = 1;
}

message ObserveVolumeRequest {
  string volume_id = 1;
}

message VolumeResponse {
  string volume_id = 1;
  string device_path = 2;
  string status = 3;
  bool exists = 4;
}

message DeleteVolumeResponse {
  bool deleted = 1;
}

message CreateSnapshotRequest {
  string volume_id = 1;
  string snapshot_id = 2;
}

message DeleteSnapshotRequest {
  string volume_id = 1;
  string snapshot_id = 2;
}

message RestoreSnapshotRequest {
  string volume_id = 1;
  string snapshot_id = 2;
}

message SnapshotResponse {
  string volume_id = 1;
  string snapshot_id = 2;
  string status = 3;
}

message DeleteSnapshotResponse {
  bool deleted = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string message = 2;
}
