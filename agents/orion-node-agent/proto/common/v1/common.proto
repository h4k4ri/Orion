syntax = "proto3";

package common.v1;

option go_package = "github.com/horizon/orion/gen/go/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

message ResourceID {
  string value = 1;
}

message ProjectID {
  string value = 1;
}

message RequestID {
  string value = 1;
}

message OperationID {
  string value = 1;
}

message NodeID {
  string value = 1;
}

message InstanceID {
  string value = 1;
}

message VolumeID {
  string value = 1;
}

message NetworkID {
  string value = 1;
}

message SubnetID {
  string value = 1;
}

message PortID {
  string value = 1;
}

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message AuditInfo {
  ResourceID created_by = 1;
  google.protobuf.Timestamp created_at = 2;
  ResourceID updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}
