[package]
name = "orion-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Orion Plugin SDK for Rust"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"
